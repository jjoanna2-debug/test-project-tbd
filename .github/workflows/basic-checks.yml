name: Basic Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-smoke-test:
    name: Repository smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "START_HERE.md"
            "Cargo.toml"
            "Cargo.lock"
            "src/main.rs"
            "scripts/check_repo.py"
            "scripts/doctor.sh"
            "docs/PROJECT_STRUCTURE.md"
            "docs/LOCAL_SETUP.md"
            "docs/GITHUB_WORKFLOW.md"
            "LICENSE"
            "LEGAL_NOTICES.md"
            "DISCLAIMER.md"
            "SECURITY.md"
            "SUPPORT.md"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "SPONSORS.md"
            "CHANGELOG.md"
            "ROADMAP.md"
            ".editorconfig"
            ".gitattributes"
            ".gitignore"
            ".github/FUNDING.yml"
            ".github/dependabot.yml"
            ".github/CODEOWNERS"
            ".github/PULL_REQUEST_TEMPLATE.md"
            ".github/ISSUE_TEMPLATE/config.yml"
            ".github/ISSUE_TEMPLATE/bug_report.yml"
            ".github/ISSUE_TEMPLATE/feature_request.yml"
            ".github/ISSUE_TEMPLATE/documentation_task.yml"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

      - name: Verify Rust starter references
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'edition = "2021"' Cargo.toml
          grep -q 'license = "Apache-2.0"' Cargo.toml
          grep -q 'name = "test-project-tbd"' Cargo.lock
          grep -q 'GitHub staging lab ready.' src/main.rs

      - name: Check Rust project
        shell: bash
        run: cargo test

      - name: Run repository doctor
        shell: bash
        run: bash scripts/doctor.sh

      - name: Print repository status
        shell: bash
        run: |
          echo "Basic repository checks passed."
