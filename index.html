<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub Learning Lab</title>
    <meta
      name="description"
      content="A small test page for learning GitHub basics."
    />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">GitHub learning sandbox</p>
        <h1 id="page-title">GitHub Learning Lab</h1>
        <p class="lede">
          A small starter page for practicing commits, branches, pull requests,
          and public repository hygiene.
        </p>
        <button id="practice-button" type="button">Run tiny check</button>
        <p id="status-message" class="status" role="status" aria-live="polite">
          Ready when you are.
        </p>
      </section>
    </main>

    <script src="src/main.js"></script>
  </body>
</html>
